<VirtualHost *:80>
  ServerName app.${BASE_DOMAIN}

  RewriteEngine On
  RewriteCond %{HTTPS} off
  RewriteCond %{REQUEST_URI} !^\/\.well-known\/.*$
  RewriteRule (.*) https://app.${BASE_DOMAIN}/$1 [R,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName app.${BASE_DOMAIN}

  SSLProtocol All -SSLv2 -SSLv3
  SSLCompression Off
  SSLCipherSuite "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+AESGCM EECDH EDH+AESGCM EDH+aRSA HIGH !MEDIUM !LOW !aNULL !eNULL !L$
  SSLEngine On
  SSLProxyEngine On

  SSLCertificateFile /etc/certs/${BASE_DOMAIN}/cert.crt
  SSLCertificateKeyFile /etc/certs/${BASE_DOMAIN}/cert.key

  # Use RewriteEngine to handle websocket connection upgrades
  RewriteEngine On
  RewriteCond %{HTTP:Connection} Upgrade [NC]
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteRule /(.*) ws://session-manager:80/$1 [P,L]

  <Location "/">
    # preserve Host header to avoid cross-origin problems
    ProxyPreserveHost on
    RequestHeader set X-Forwarded-Proto https
    # proxy to SessionManager/Container
    Header unset x-frame-options
    Header unset Content-Security-Policy
    ProxyPass         http://session-manager:80/
    ProxyPassReverse  http://session-manager:80/
  </Location>

  ServerAdmin support@humlab.umu.se

  ErrorLog ${APACHE_LOG_DIR}/app-error.log
  # The session access code travels in the query string on every iframe load -
  # JupyterSession.class.js sets JUPYTER_TOKEN to that very code, so ?token= is
  # Jupyter's password as well as VISP's session credential. `%r` logs the whole
  # request line, which wrote a live credential into app-access.log each time a
  # notebook was opened. `%U` is the path alone. The Referer field is dropped with
  # it: a subresource's Referer is the page URL, query included, so keeping it
  # would put the code straight back.
  LogFormat "%h %l %u %t \"%U\" %>s %b \"%{User-Agent}i\"" app_nocookie
  CustomLog ${APACHE_LOG_DIR}/app-access.log app_nocookie

</VirtualHost>
