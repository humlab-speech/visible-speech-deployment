#Port 80 will never be hit while the master-edge-router is being used since it automatically forwards all traffic to port 8081 which goes directly to 443
<VirtualHost *:80>
  ServerName ${TRATT_SUBDOMAIN}.${BASE_DOMAIN}

  RewriteEngine On
  RewriteCond %{HTTPS} off
  RewriteCond %{REQUEST_URI} !^\/\.well-known\/.*$
  RewriteRule (.*) https://${TRATT_SUBDOMAIN}.${BASE_DOMAIN}/$1 [R,L]

</VirtualHost>

<VirtualHost *:443>

  ServerName ${TRATT_SUBDOMAIN}.${BASE_DOMAIN}

  SSLProtocol All -SSLv2 -SSLv3
  SSLCompression Off
  SSLCipherSuite "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+AESGCM EECDH EDH+AESGCM EDH+aRSA HIGH !MEDIUM !LOW !aNULL !eNULL !LOW"
  SSLEngine On
  SSLProxyEngine On

  SSLCertificateFile /etc/certs/${BASE_DOMAIN}/cert.crt
  SSLCertificateKeyFile /etc/certs/${BASE_DOMAIN}/cert.key

  #SSLCertificateFile /certs/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem
  #SSLCertificateKeyFile /certs/letsencrypt/live/${BASE_DOMAIN}/privkey.pem

  RequestHeader set X-Forwarded-Proto "https"

  # Map /api to the PHP API (same as the HTTP vhost) — must NOT be proxied to TRATT
  Alias /api /var/www/html/api

  RewriteEngine On
  # WebSocket upgrade
  RewriteCond %{HTTP:Connection} Upgrade [NC]
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteRule /(.*) ws://tratt/$1 [P,L]

  # Route /api/v1/* to api.php
  RewriteRule ^/api/v1/(.*)$ /api/api.php [L]

  ProxyPreserveHost On
  # Cross-origin isolation headers required by TRATT for SharedArrayBuffer in
  # WebWorkers (in-browser ASR). COEP=credentialless matches the app's own
  # .htaccess (more permissive than the old OCTRA require-corp).
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Cross-Origin-Embedder-Policy "credentialless"

  # Exclude /api from proxying — handled locally above
  ProxyPass /api !
  ProxyPass / http://tratt/
  ProxyPassReverse / https://${TRATT_SUBDOMAIN}.${BASE_DOMAIN}/

  ServerAdmin support@humlab.umu.se

  ErrorLog ${APACHE_LOG_DIR}/tratt-error.log
  CustomLog ${APACHE_LOG_DIR}/tratt-access.log combined

</VirtualHost>
