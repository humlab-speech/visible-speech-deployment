<VirtualHost *:80>
  # NOTE: ServerName includes https:// protocol and :443 port deliberately.
  # This configuration is required for the system to work correctly in both
  # local development and production environments with load balancers.
  # DO NOT change this to just ${BASE_DOMAIN} despite Apache warnings.
  ServerName https://${BASE_DOMAIN}:443
  ServerAlias apache
  ServerAlias edge-router
  UseCanonicalName On
  DirectoryIndex index.php

  # Read this before widening the line below.
  # This does NOT expose the authenticated page shell: a credentialed response
  # cannot be served to `*`, and Access-Control-Allow-Credentials is not set
  # anywhere here, so script on another origin - including a sibling subdomain -
  # cannot read a response that required the session cookie. What it does expose
  # is anything that answers without one.
  # Separate and unrelated to this header: the shell hands the session id to
  # first-party JS as window.visp.phpSessionId (src/index.php, since b3a4dbb), so
  # the HttpOnly cookie protects the id from third-party script on the page, not
  # from the application's own. Don't re-describe this header as the reason for
  # that - fixing it means re-tokenising the websocket, see TODO.
  Header set Access-Control-Allow-Origin "*"

  # Use RewriteEngine to handle websocket connection upgrades, and proxy them to the WebSocketApiServer in Session-Manager
  RewriteEngine On
  RewriteCond %{HTTP:Connection} Upgrade [NC]
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteRule /(.*) ws://session-manager:8020/$1 [P,L]

  #used to be /auth
  <Location /DS/Login>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require valid-user
    ShibUseEnvironment On
    ShibUseHeaders Off
  </Location>

  <Location /SAML2>
    AuthType shibboleth
    ShibRequestSetting requireSession 0
    Require shibboleth
    ShibUseEnvironment On
    ShibUseHeaders Off
  </Location>

  <Location /SLO>
    AuthType shibboleth
    ShibRequestSetting requireSession 0
    Require shibboleth
    ShibUseEnvironment On
    ShibUseHeaders Off
  </Location>

  <Location /Artifact>
    AuthType shibboleth
    ShibRequestSetting requireSession 0
    Require shibboleth
    ShibUseEnvironment On
    ShibUseHeaders Off
  </Location>

  <Directory /var/www/html>
    Options -Indexes

    <Files "index.php">
      AuthType shibboleth
      ShibRequestSetting requireSession 0
      Require shibboleth
      ShibUseEnvironment On
      ShibUseHeaders Off
    </Files>
  </Directory>

  <Location /spr/api/v1>
    RequestHeader set X-Forwarded-Proto https
    ProxyPreserveHost On
    ProxyPass         http://wsrng-server:8080
    ProxyPassReverse  http://wsrng-server:8080
  </Location>

  # Map /api to the webclient api directory (single source of truth)
  # webclient api.php is at /var/www/html/api/api.php (served from DocumentRoot)
  Alias /api /var/www/html/api

  # Top-level rewrite rule (before fallback to index.php)
  RewriteEngine On
  RewriteRule ^/api/v1/(.*)$ /api/api.php [L]

  <Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    # Uploads reach api.php through here. Apache 2.4.54+ defaults this to 1 GiB
    # and answers 413 before PHP runs, so without it php.ini's 10 GiB
    # upload_max_filesize/post_max_size never applied. Keep it equal to those.
    LimitRequestBody 10737418240
    # Nothing in this directory is meant to be fetched except its PHP files. In
    # dev the whole tree is bind-mounted from the source checkout and granted
    # wholesale, so whatever an editor, an OS or a person leaves behind here
    # (foo.php.bak, .DS_Store, a spec that used to live here) reaches anonymous
    # clients. PCRE lookahead, not a "!" prefix: mod_core has no negation form
    # for FilesMatch patterns.
    <FilesMatch "^(?!.*\.php$).*$">
      Require all denied
    </FilesMatch>
  </Directory>

  <Directory /var/www/html/api/tests>
    # The test harness ends in .php, so the FilesMatch above cannot keep it
    # from being served: in dev the source api/ is bind-mounted and
    # GET /api/tests/run-tests.php would run it. Prod is unaffected
    # (angular.json no longer copies tests/ into dist), and the harness lives
    # outside api/ since webclient 4a4ec6f - this block keeps it denied even
    # if it ever moves back.
    Require all denied
  </Directory>

  # Matomo tracking proxy — serve tracker JS and collection endpoint from
  # the same origin, using non-obvious names to avoid ad-blocker filter lists
  # and Firefox Enhanced Tracking Protection.
  ProxyPass        /vt.js  http://matomo/matomo.js
  ProxyPassReverse /vt.js  http://matomo/matomo.js
  ProxyPass        /vt     http://matomo/matomo.php
  ProxyPassReverse /vt     http://matomo/matomo.php

  <Location />
    RewriteEngine On
    RewriteBase /
    RewriteCond expr "! %{HTTP:Upgrade} -strmatch 'websocket'" [NC]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/Shibboleth
    RewriteCond %{REQUEST_URI} !^/SAML2
    RewriteCond %{REQUEST_URI} !^/SLO
    RewriteCond %{REQUEST_URI} !^/Artifact
    RewriteCond %{REQUEST_URI} !^/DS/
    RewriteCond %{REQUEST_URI} !^/Metadata
    RewriteCond %{REQUEST_URI} !^/Status
    RewriteCond %{REQUEST_URI} !^/Session
    RewriteCond %{REQUEST_URI} !^/DiscoFeed
    RewriteCond %{REQUEST_URI} !^/Logout
    RewriteCond %{REQUEST_URI} !^/spr/api
    RewriteCond %{REQUEST_URI} !^/vt(\.js)?$
    RewriteRule . /index.php [L]
  </Location>

  ServerAdmin support@humlab.umu.se

  LogLevel info

  ErrorLog ${APACHE_LOG_DIR}/${BASE_DOMAIN}-error.log
  # Same reason app.vhost.conf dropped `combined`: the webclient puts the session
  # access code in the main-origin address bar (/app?token=…), so %r and the
  # Referer wrote a live credential into this log on every reload or bookmark.
  # `%U` is the path alone. LogFormat is repeated per vhost because a nickname
  # defined inside a <VirtualHost> is only visible in that vhost.
  LogFormat "%h %l %u %t \"%U\" %>s %b \"%{User-Agent}i\"" app_nocookie
  CustomLog ${APACHE_LOG_DIR}/${BASE_DOMAIN}-access.log app_nocookie

</VirtualHost>
