# Dev only: same as http.conf, on 443 with the self-signed visp.local cert that
# Apache uses in dev (vhosts-https/). The quadlet mounts certs/<BASE_DOMAIN>/ at /etc/certs.

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/certs/cert.crt;
    ssl_certificate_key /etc/certs/cert.key;

    root /usr/share/nginx/html;

    # A URI (not a named location) so nginx turns POSTs etc. into GET for the page.
    error_page 503 /_offline-page;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /_offline/ {
        try_files $uri =404;
    }

    location = /_offline-page {
        internal;
        default_type text/html;
        alias /usr/share/nginx/html/index.html;
    }

    location / {
        return 503;
    }
}
