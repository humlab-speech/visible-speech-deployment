# VISP offline placeholder (./visp.py placeholder up) — no PHP, no proxying.
# Answers every host and path with the offline page and 503, so crawlers and
# monitors see a temporary outage. Only /_offline/ serves real files (page assets).

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # A URI (not a named location) so nginx turns POSTs etc. into GET for the page.
    error_page 503 /_offline-page;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /_offline/ {
        try_files $uri =404;
    }

    location = /_offline-page {
        internal;
        default_type text/html;
        alias /usr/share/nginx/html/index.html;
    }

    location / {
        return 503;
    }
}
